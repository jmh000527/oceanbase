version: '3.8'

services:
  postgres:
    build: .
    image: pg_outline:latest
    container_name: pg_outline_test
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./test:/test
    command: postgres -c shared_preload_libraries=''

  pg_outline_test:
    image: pg_outline:latest
    depends_on:
      - postgres
    entrypoint: /bin/bash
    command: -c "sleep 5 && psql -h postgres -U postgres -d testdb -f /test/test_outline.sql"
    environment:
      PGPASSWORD: postgres

volumes:
  pg_data:
